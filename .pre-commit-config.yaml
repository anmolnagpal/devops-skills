# Local hooks only, so nothing needs installing beyond pre-commit itself and the
# pyyaml the scripts already require.
#
#   pip install pre-commit && pre-commit install
#
# These are the six free gates, the same ones CI runs, and they finish in about six
# seconds. The behavioral evals are deliberately NOT here: they take 45 to 90 minutes
# and 2.5% of their prompts are non-deterministic, so as a commit hook they would both
# waste an hour and block commits at random. They run weekly in CI and on demand
# instead, per _docs/EVAL-RESULTS.md.
repos:
  - repo: local
    hooks:
      - id: validate
        name: validate (skills, versions, rule IDs, evals, prompts, adapters)
        entry: bash scripts/validate.sh
        language: system
        pass_filenames: false
        # Any of these can invalidate any check: a skill edit changes the adapters, a
        # registry edit changes rule-ID validity, a version bump touches three files.
        files: '^(skills/|rules/|scripts/|\.claude-plugin/|CHANGELOG\.md|\.cursor/rules/|AGENTS\.md)'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Eval fixtures legitimately hold multiple manifests separated by ---, the way
        # a real Kubernetes or Argo CD file does.
        args: [--allow-multiple-documents]
        # The generated Cursor rules carry a description line with unquoted colons that
        # is valid for Cursor and not for a strict YAML parser.
        exclude: '^\.cursor/rules/'
      - id: check-json
      - id: end-of-file-fixer
        # AGENTS.md and .cursor/rules/ are generated by scripts/generate.sh. If the
        # fixer edits them the adapter-sync gate fails on the next run, so the
        # generator owns their exact bytes.
        exclude: '^(AGENTS\.md|\.cursor/rules/)'
      - id: trailing-whitespace
        # Eval fixtures are inputs under test. Trailing whitespace in one may be the
        # thing a rule keys on, so never rewrite them.
        exclude: '^skills/[^/]+/evals/cases/'
      - id: detect-private-key
        # The appsec fixture ships an inert placeholder key on purpose: SEC-SEC-004
        # detects a committed private key, so proving it needs one present.
        exclude: '^skills/appsec/evals/cases/'
