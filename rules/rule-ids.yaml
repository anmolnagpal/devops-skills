# Canonical rule-ID registry — shared vocabulary for ClouDrove DevOps tooling.
#
# This is the single source of truth for the rule IDs that review skills emit.
# Both this repo (the `clouddrove` Claude Code plugin) and the auditkit audit
# engine reference these IDs so findings line up and never drift.
#
# Format: <DOMAIN>-<CATEGORY>-<NNN>. Each entry is `id: one-line meaning`.
# CI (`scripts/check-rule-ids.sh`) asserts every ID used in any
# skills/<name>/SKILL.md Rule Catalog exists here.
#
# Scope: this public registry covers the shared review vocabulary. auditkit may
# define additional private-only domains; it checks its overlapping IDs against
# this file.

version: 1

# ── Terraform (generic) ───────────────────────────────────────────────────────
TF:
  TF-STATE-001: 'no remote backend'
  TF-STATE-002: 'no state locking'
  TF-STATE-003: 'state file committed'
  TF-PROV-001: 'providers not version-pinned'
  TF-PROV-002: 'no required_providers / terraform version block'
  TF-MOD-001: 'no module reuse'
  TF-MOD-002: 'modules not versioned'
  TF-VAR-001: 'hardcoded secret'
  TF-VAR-002: 'sensitive var not marked sensitive'
  TF-VAR-003: 'variable missing description/type'
  TF-VAR-004: 'hardcoded env-specific value (region/account/ARN/env/CIDR) outside backend'
  TF-OUT-001: 'output missing description'
  TF-OUT-002: 'sensitive output not marked sensitive'
  TF-RES-001: 'missing required tags'
  TF-RES-002: 'missing lifecycle rules on stateful resources'
  TF-QUAL-001: 'repetition (no locals)'
  TF-QUAL-002: 'no README'

# ── Security ──────────────────────────────────────────────────────────────────
SEC:
  SEC-NET-001: '0.0.0.0/0 ingress on non-80/443'
  SEC-NET-002: 'DB in public subnet'
  SEC-NET-003: 'no VPC segmentation'
  SEC-ENC-001: 'encryption at rest disabled'
  SEC-ENC-002: 'TLS < 1.2'
  SEC-ENC-003: 'no WAF on public endpoint'
  SEC-IAM-001: 'wildcard action/resource'
  SEC-IAM-002: 'long-lived IAM keys'
  SEC-IAM-003: 'MFA not enforced'
  SEC-PUB-001: 'bucket public'
  SEC-LOG-001: 'CloudTrail/Audit Logs disabled'
  SEC-LOG-002: 'VPC flow logs disabled'
  SEC-SEC-001: 'secret in current files'
  SEC-SEC-002: 'secret in git history'
  SEC-SEC-003: '.env committed'
  SEC-SEC-004: 'private key in repo'
  SEC-SEC-005: 'no pre-commit secret scanning'
  SEC-DEP-001: 'vulnerable dependency'
  SEC-APP-001: 'missing security headers'
  SEC-APP-002: 'CORS wildcard'
  SEC-K8S-001: 'pod securityContext missing/incomplete (runAsNonRoot, no privilege escalation, read-only rootfs)'
  SEC-K8S-002: 'privileged container / hostPath / host PID·IPC·Network namespace'
  SEC-K8S-003: 'RBAC over-grant (wildcard verb/resource, cluster-admin binding to SA/user)'
  SEC-K8S-004: 'no NetworkPolicy / namespace not network-segmented'
  SEC-K8S-005: 'missing CPU/memory limits or requests on workload'
  SEC-K8S-006: 'exposed/insecure service (NodePort to internet, kubernetes-dashboard, anonymous API)'
  SEC-K8S-007: 'automountServiceAccountToken enabled / secret exposed via env or unmounted'
  SEC-DNS-001: 'DNSSEC not enabled'
  SEC-DNS-002: 'no CAA record'
  SEC-DNS-003: 'DNS zone transfer (AXFR) open'
  SEC-EMAIL-001: 'SPF missing or weak'
  SEC-EMAIL-002: 'DMARC missing or weak (policy/subdomain policy)'

