  CICD-DOCK-001: '":latest" base image'
  CICD-DOCK-002: 'container runs as root'
  CICD-DOCK-003: 'no multi-stage build'
  CICD-DOCK-004: 'ADD remote URL'
  CICD-DOCK-005: 'no --no-install-recommends'
