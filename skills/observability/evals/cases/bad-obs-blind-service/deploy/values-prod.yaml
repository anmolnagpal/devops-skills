# checkout-api, production. Nothing here collects a metric.
replicaCount: 3

image:
  repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/checkout-api
  tag: ""

commonLabels:
  app: checkout-api
  env: prod
  team: payments

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "256Mi"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

serviceAccount:
  create: true
  automountServiceAccountToken: false
