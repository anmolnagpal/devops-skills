# Fixture: correct GitLab pipeline. Should produce ZERO findings.
variables:
  SVC: my-service
  CHART_DIR: ./helm/my-service
  NS: my-namespace

stages:
  - deploy-staging
  - deploy-production

default:
  image: alpine/helm:3.14.0

.deploy: &deploy
  script:
    - helm lint ${CHART_DIR}
    - helm upgrade --install ${SVC} ${CHART_DIR}
        --namespace ${NS}
        --set image.tag=${IMAGE_TAG}
        --atomic
        --wait

deploy-staging:
  <<: *deploy
  stage: deploy-staging
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  before_script:
    - echo "$KUBECONFIG_STAGING" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  <<: *deploy
  stage: deploy-production
  variables:
    IMAGE_TAG: $CI_COMMIT_TAG
  before_script:
    - echo "$KUBECONFIG_PROD" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: false
