# First production release of payments-api.
replicaCount: 1

image:
  repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/payments-api
  tag: latest

commonLabels:
  app: payments-api
  env: prod
  team: payments

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "1Gi"

env:
  - name: STRIPE_SECRET_KEY
    value: "sk_live_REDACTED_FIXTURE_VALUE_NOT_A_REAL_KEY"
