name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Public repository, and fork PRs reach this runner with no restriction.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    strategy:
      matrix:
        node: ["22", "24"]
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  lint:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
