apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout-api-alerts
spec:
  groups:
    - name: checkout-api
      rules:
        - alert: CheckoutApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{service="checkout-api",code=~"5.."}[5m]))
              / sum(rate(http_requests_total{service="checkout-api"}[5m])) > 0.02
          for: 10m
          labels:
            severity: page
            team: payments
          annotations:
            summary: "checkout-api 5xx rate above 2%"

        - alert: CheckoutApiPaymentsBacklog
          expr: sum(payment_queue_depth{service="checkout-api"}) > 5000
          for: 15m
          labels:
            severity: page
            team: payments
          annotations:
            summary: "payment queue backing up"

        - alert: CheckoutApiCacheMissRateElevated
          expr: rate(cache_misses_total{service="checkout-api"}[15m]) > 100
          for: 30m
          labels:
            severity: ticket
            team: payments
          annotations:
            summary: "cache miss rate elevated"
