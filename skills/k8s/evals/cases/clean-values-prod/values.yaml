# Fixture: should produce ZERO findings. Target env: prod.
replicaCount: 2

image:
  repository: 123456789.dkr.ecr.eu-west-1.amazonaws.com/acme
  tag: ""            # set at deploy: --set image.tag=$IMAGE_TAG
  pullPolicy: IfNotPresent

commonLabels:
  app: acme
  env: prod
  team: platform

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

env:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: acme-secrets
        key: db-password

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/acme
