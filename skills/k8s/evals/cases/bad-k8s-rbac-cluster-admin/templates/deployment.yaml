apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-api
  labels:
    app: invoice-api
    env: prod
    team: billing
spec:
  replicas: 3
  template:
    spec:
      serviceAccountName: invoice-api
      containers:
        - name: invoice-api
          image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/invoice-api:1.8.2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
