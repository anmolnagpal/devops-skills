replicaCount: 3

image:
  repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/search-api
  tag: ""
  pullPolicy: IfNotPresent

commonLabels:
  app: search-api
  env: prod
  team: discovery

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "1Gi"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  automountServiceAccountToken: false
