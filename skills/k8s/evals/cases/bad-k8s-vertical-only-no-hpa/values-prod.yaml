# Request-serving API. Takes more load by growing the pod, not by adding pods.
replicaCount: 2

image:
  repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/orders-api
  tag: ""
  pullPolicy: IfNotPresent

commonLabels:
  app: orders-api
  env: prod
  team: orders

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: "4"
    memory: "16Gi"
  limits:
    cpu: "8"
    memory: "16Gi"

autoscaling:
  enabled: false

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

serviceAccount:
  create: true
  automountServiceAccountToken: false
