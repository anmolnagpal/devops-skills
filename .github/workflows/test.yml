name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-docker:
    name: Docker install harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Build test image and run install harness
        run: bash _test/test.sh

  generator:
    name: Adapters in sync with skills/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with: { python-version: '3.x' }
      - run: pip install pyyaml
      - name: Adapters in sync with skills/ (regenerate + fail on drift)
        run: bash scripts/generate.sh --check

  skills-lint:
    name: Skill frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with: { python-version: '3.x' }
      - run: pip install pyyaml
      - name: Lint every skill's frontmatter (name matches dir, description present)
        run: bash scripts/check-skills.sh

  rule-ids:
    name: Rule IDs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with: { python-version: '3.x' }
      - run: pip install pyyaml
      - name: Every skill rule ID exists in the canonical registry
        run: bash scripts/check-rule-ids.sh

  evals:
    name: Skill evals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Validate every skill's eval fixtures against its Rule Catalog
        run: bash scripts/check-evals.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          severity: warning
          scandir: ./scripts
          additional_files: hooks/bash-guard.sh hooks/session-banner.sh
